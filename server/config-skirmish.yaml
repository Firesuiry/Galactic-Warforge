# 遭遇战预设（A1）。
# 地图不是本文件字段，启动参数要单独给 map 文件。需配合：
#   cd server && go run ./cmd/server -config config-skirmish.yaml -map-config map-skirmish.yaml
# 地图文件：server/map-skirmish.yaml（由地图任务创建，本预设不创建地图）。
# 10 tick/s 时 60 分钟 = 36000 tick，90 分钟 = 54000 tick。
battlefield:
  map_seed: "skirmish-seed-001"
  max_tick_rate: 10
  victory_rule: "elimination"
  enemy_difficulty: "normal"
  construction_region_concurrent_limit: 4
  # 研究倍率 2：目录基准成本（电磁学 10 个电磁矩阵）×2 = 20 个。
  # 目标区间（熟练玩家，产线摆好、持续供料）：
  #   电磁学约 tick 5000–8000 完成；武器系统（基准 20 → 40 个）连同
  #   自动化冶金/基础制造前置链，约 tick 12000–18000 拿到炮塔，
  #   即 bot 首攻（bot_first_attack_tick 16000）前后玩家已有防御。
  # 旧的 6 倍（电磁学 60 个）在 60–90 分钟一局里根本完不成任何科技。
  pace_research: 2
  pace_build: 2
  pace_output: 2
  time_limit_ticks: 54000
  threat_growth_scale: 1.5
  # 黑雾被动：被某玩家伤害后才对其敌对，最后一次伤害后 6000 tick 恢复中立。
  dark_fog_calm_ticks: 6000
  # bot 开局发育期：tick 16000（约 27 分钟）前军团只守家，给玩家时间起产线。
  bot_first_attack_tick: 16000

players:
  - player_id: "p1"
    key: "key_player_1"
    team_id: "team-1"
    role: "admin"
    permissions: ["*"]
    executor:
      build_efficiency: 1.0
      operate_range: 6
      concurrent_tasks: 2
      research_boost: 0.0
    # 开局物资包（双方相同）：够直接建 风机×3、电感应塔×4、采矿机×4、电弧熔炉×2、制造台×1、
    # 传送带×20、矩阵研究站×1，外加 20 块煤给机甲补能。之后靠自己的产线推进。
    # 各建筑成本合计：铁块 102、齿轮 39、磁线圈 29、电路板 24、石砖 4、玻璃 4，
    # 矿物 910、能量 350；这里留少量余量（铁块 110、磁线圈 30）供施工期间的损耗。
    bootstrap: &skirmish_kit
      minerals: 1200
      energy: 400
      inventory:
        - { item_id: iron_ingot, quantity: 110 }
        - { item_id: gear, quantity: 40 }
        - { item_id: magnetic_coil, quantity: 30 }
        - { item_id: circuit_board, quantity: 24 }
        - { item_id: stone_brick, quantity: 4 }
        - { item_id: glass, quantity: 4 }
        - { item_id: coal, quantity: 20 }
  - player_id: "p2"
    key: "key_player_2"
    team_id: "team-2"
    role: "commander"
    permissions: ["*"]
    bot: "hard"
    executor:
      build_efficiency: 1.0
      operate_range: 6
      concurrent_tasks: 2
      research_boost: 0.0
    bootstrap: *skirmish_kit

server:
  port: 18082
  rate_limit: 20
  event_history_limit: 2000
  snapshot_max_events: 200
  alert_history_limit: 1000
  data_dir: "data-skirmish"
  # 命名存档点根目录（试玩读档用）。留空则 /checkpoints 系列接口返回 503。
  checkpoint_dir: "checkpoints-skirmish"
  auto_save_interval_seconds: 60
  snapshot_interval_ticks: 100
  snapshot_retention_ticks: 6000
  snapshot_retention_count: 60
  snapshot_max_bytes: 2097152
  production_monitor:
    sample_interval_ticks: 5
    max_entities_per_sample: 500
    backlog_warn_ratio: 0.6
    backlog_critical_ratio: 0.9
    shortage_ratio: 0.2
    efficiency_warn_ratio: 0.5
    alert_cooldown_ticks: 20
