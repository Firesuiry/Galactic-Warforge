# 建筑定义（基础属性 + 运行时参数）。
# 格式说明见 docs/dev/数据配置文件.md
buildings:
  - id: battlefield_analysis_base
    name: 战场分析基站
    category: command_signal
    subcategory: command_signal
    footprint: {width: 1, height: 1}
    build_cost:
      minerals: 120
      energy: 60
      items:
        - {item_id: circuit_board, quantity: 18}
        - {item_id: engine, quantity: 12}
        - {item_id: microcrystalline_component, quantity: 6}
        - {item_id: steel, quantity: 12}
    buildable: true
    build_radius: 24
    profile: {max_hp_base: 500, max_hp_per_level: 200, vision_range: 5}
    runtime:
      params:
        energy_consume: 2
        capacity: 4
        connection_points: [{id: power, kind: power, capacity: 1}]
        io_ports: [{id: in-0, direction: input, capacity: 2}, {id: out-0, direction: output, capacity: 1}]
      functions:
        storage: {capacity: 60, slots: 4, buffer: 20, input_priority: 2, output_priority: 1}
        energy: {consume_per_tick: 2}
        deployment:
          squad_capacity: 4
          fleet_capacity: 2
          allowed_blueprints: [prototype, precision_drone, corvette, destroyer]
  - id: mining_machine
