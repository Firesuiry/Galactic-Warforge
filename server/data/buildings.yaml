        collect: {allowed_resources: [iron_ore, copper_ore, stone_ore, silicon_ore, titanium_ore, coal, fire_ice, fractal_silicon, grating_crystal, monopole_magnet, kimberlite_ore, spiniform_stalagmite_crystal, organic_crystal], yield_per_tick: 8, minerals_kickback: 1}
