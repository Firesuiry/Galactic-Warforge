public_blueprints:
  - id: prototype
    name: Prototype
    domain: ground
    source: preset
    base_frame_id: light_frame
    visible_tech_id: prototype
    runtime_class: combat_squad
    production_mode: factory_recipe
    deploy_command: deploy_squad
    query_scopes: [planet_runtime]
    commands: [deploy_squad]
    components:
      - {slot_id: power_core, component_id: micro_reactor}
      - {slot_id: mobility, component_id: servo_drive}
      - {slot_id: armor, component_id: reactive_armor}
      - {slot_id: sensor, component_id: tactical_radar}
      - {slot_id: weapon_primary, component_id: plasma_lance}
