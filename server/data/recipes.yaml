  # 蓄电器（物品）按 DSP 原版（scope.json accumulator）：制造台合成，能量枢纽充/放电循环
  # 产出 accumulator_full。此前只有建筑形态、物品只能由建筑合成路径凭空获得，
  # 导致「所有物品从新局可达」不成立。
  - id: accumulator
    name: 蓄电器
    inputs:
      - {item_id: crystal_silicon, quantity: 3}
      - {item_id: iron_ingot, quantity: 6}
      - {item_id: super_magnetic_ring, quantity: 1}
    outputs: [{item_id: accumulator, quantity: 1}]
    duration: 90
    energy_cost: 3
    building_types: [assembling_machine_mk1, assembling_machine_mk2, assembling_machine_mk3, recomposing_assembler]
    tech_unlock: [energy_storage]
