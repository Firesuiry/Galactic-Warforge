battlefield:
  map_seed: "midgame-seed-001"
  max_tick_rate: 10
  victory_rule: "hybrid"
  initial_active_planet_id: "planet-1-2"
  construction_region_concurrent_limit: 4

players:
  - player_id: "p1"
    key: "key_player_1"
    team_id: "team-1"
    role: "commander"
    permissions: ["*"]
    # 开局物资包（第 16 轮：去掉资金维度，原 minerals/energy 折算成实物料）。
    # 中期局要能直接铺开星际物流与戴森链，故给了整套中间件与火箭。
    bootstrap:
      items:
        - item_id: frame_material
          quantity: 16
        - item_id: deuterium_fuel_rod
          quantity: 16
        - item_id: quantum_chip
          quantity: 16
        - item_id: solar_sail
          quantity: 16
        - item_id: small_carrier_rocket
          quantity: 4
      completed_techs:
        - electromagnetism
        - basic_logistics_system
        - automatic_metallurgy
        - basic_assembling_processes
        - high_strength_crystal
        - titanium_alloy
        - lightweight_structure
        - dyson_component
        - interstellar_logistics
        - interstellar_power
        - signal_tower
        - plasma_turret
        - gas_giants
        - gravity_matrix
        - planetary_shield
        - self_evolution
        - quantum_chip
        - solar_sail_orbit
        - ray_receiver
        - vertical_launching
        - integrated_logistics
        - photon_mining
        - annihilation
  - player_id: "p2"
    key: "key_player_2"
    team_id: "team-2"
    role: "commander"
    permissions: ["*"]
    # 开局物资包（第 16 轮：去掉资金维度，原 minerals/energy 折算成实物料）。
    # 中期局要能直接铺开星际物流与戴森链，故给了整套中间件与火箭。
    bootstrap:
      items:
        - item_id: frame_material
          quantity: 16
        - item_id: deuterium_fuel_rod
          quantity: 16
        - item_id: quantum_chip
          quantity: 16
        - item_id: solar_sail
          quantity: 16
        - item_id: small_carrier_rocket
          quantity: 4
      completed_techs:
        - electromagnetism
        - basic_logistics_system
        - automatic_metallurgy
        - basic_assembling_processes
        - high_strength_crystal
        - titanium_alloy
        - lightweight_structure
        - dyson_component
        - interstellar_logistics
        - interstellar_power
        - signal_tower
        - plasma_turret
        - gas_giants
        - gravity_matrix
        - planetary_shield
        - self_evolution
        - quantum_chip
        - solar_sail_orbit
        - ray_receiver
        - vertical_launching
        - integrated_logistics
        - photon_mining
        - annihilation

scenario_bootstrap:
  planets:
    - planet_id: "planet-1-2"
      buildings:
        - owner_id: "p1"
          building_type: "tesla_tower"
          x: 15
          y: 9
          state: "running"
        - owner_id: "p1"
          building_type: "wind_turbine"
          x: 12
          y: 15
          state: "running"
        - owner_id: "p1"
          building_type: "wind_turbine"
          x: 18
          y: 15
          state: "running"
        - owner_id: "p1"
          building_type: "wind_turbine"
          x: 24
          y: 15
          state: "running"
        - owner_id: "p1"
          building_type: "wind_turbine"
          x: 30
          y: 15
          state: "running"
        - owner_id: "p1"
          building_type: "ray_receiver"
          x: 24
          y: 6
          state: "running"
          ray_receiver_mode: "power"
        - owner_id: "p1"
          building_type: "em_rail_ejector"
          x: 30
          y: 6
          state: "running"
          inventory:
            - item_id: solar_sail
              quantity: 4
        - owner_id: "p1"
          building_type: "vertical_launching_silo"
          x: 30
          y: 12
          state: "running"
          inventory:
            - item_id: small_carrier_rocket
              quantity: 2
        # 运输机器人（§2）试玩夹具：起点储物仓（有铁矿）→ 终点储物仓，
        # 便于用 CLI `haul` 设一条路线看 phase 与终点库存增长。
        # 细分网格下默认拉线距离只有 3 cell，这两个仓离出生点电网很远，
        # 中间补三座电力感应塔把电接过去（否则仓是 no_power，虽然不影响
        # haul 装卸，但试玩时会被误当成故障）。
        - owner_id: "p1"
          building_type: "tesla_tower"
          x: 15
          y: 12
          state: "running"
        - owner_id: "p1"
          building_type: "tesla_tower"
          x: 15
          y: 15
          state: "running"
        - owner_id: "p1"
          building_type: "tesla_tower"
          x: 15
          y: 18
          state: "running"
        - owner_id: "p1"
          building_type: "depot_mk1"
          x: 18
          y: 20
          state: "running"
          inventory:
            - item_id: iron_ore
              quantity: 60
        - owner_id: "p1"
          building_type: "depot_mk2"
          x: 36
          y: 20
          state: "running"
  systems:
    - player_id: "p1"
      system_id: "sys-1"
      dyson_layers:
        - layer_index: 0
          orbit_radius: 1.2
          nodes:
            - latitude: 10
              longitude: 20
          shells:
            - latitude_min: -15
              latitude_max: 15
              coverage: 0.35
      solar_sail_orbit:
        count: 8
        orbit_radius: 1.2
        inclination: 5
    - player_id: "p2"
      system_id: "sys-1"
      dyson_layers:
        - layer_index: 0
          orbit_radius: 1.2
          nodes:
            - latitude: -12
              longitude: 200
      solar_sail_orbit:
        count: 4
        orbit_radius: 1.2
        inclination: 5

server:
  port: 18080
  event_history_limit: 2000
  snapshot_max_events: 200
  alert_history_limit: 1000
  data_dir: "data-midgame"
  auto_save_interval_seconds: 60
  snapshot_interval_ticks: 5000
  snapshot_retention_ticks: 30000
  snapshot_retention_count: 6
  snapshot_max_bytes: 268435456
  production_monitor:
    sample_interval_ticks: 5
    max_entities_per_sample: 500
    backlog_warn_ratio: 0.6
    backlog_critical_ratio: 0.9
    shortage_ratio: 0.2
    efficiency_warn_ratio: 0.5
    alert_cooldown_ticks: 20
