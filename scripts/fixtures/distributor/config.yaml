battlefield:
  construction_region_concurrent_limit: 4
  initial_active_planet_id: planet-1-1
  map_seed: war-seed-001
  max_tick_rate: 10
  victory_rule: hybrid
players:
  - player_id: p1
    key: key_player_1
    role: commander
    team_id: team-1
    permissions: ['*']
    executor:
      build_efficiency: 1.0
      concurrent_tasks: 2
      operate_range: 6
    bootstrap:
      completed_techs: [electromagnetism, basic_logistics_system, automatic_metallurgy, basic_assembling_processes, distribution_logistics]
      minerals: 20000
      energy: 20000
      inventory:
        - {item_id: iron_ingot, quantity: 1000}
        - {item_id: copper_ingot, quantity: 1000}
        - {item_id: circuit_board, quantity: 100}
        - {item_id: motor, quantity: 30}
        - {item_id: energetic_graphite, quantity: 30}
        - {item_id: logistics_bot, quantity: 6}
  - player_id: p2
    key: key_player_2
    role: commander
    team_id: team-2
    permissions: ['*']
server:
  port: 19500
  data_dir: /tmp/sw-distributor-playtest-data
  auto_save_interval_seconds: 0
  event_history_limit: 5000
  alert_history_limit: 1000
  rate_limit: 50
  snapshot_interval_ticks: 100000
  snapshot_retention_count: 6
  snapshot_retention_ticks: 30000
  snapshot_max_events: 200
  snapshot_max_bytes: 268435456
  snapshot_delta_max_bytes: 134217728
